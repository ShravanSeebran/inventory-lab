[project]
name = "backend"
version = "0.1.0"
description = "The API backend for inventory-lab"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.1",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "pytest>=8.4.2",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = ["playwright>=1.55.0"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
