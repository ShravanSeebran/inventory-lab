<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Inventory Lab</title>
  <link rel="stylesheet" href="/assets/styles/main.css">
  <script type="module" src="/assets/account.js"></script>
</head>
<body>
  <header><a href="/register">Inventory Lab</a><span>Inventory starts with your team.</span></header>
  <main>
    <p class="eyebrow">YOUR WORKSPACE</p>
    <h1>Create your account</h1>
    <p>Keep your stock and your team in sync.</p>
    <form id="register-form">
      <div class="row">
        <label>First name<input name="first_name" autocomplete="given-name" required maxlength="50"></label>
        <label>Last name<input name="last_name" autocomplete="family-name" required maxlength="50"></label>
      </div>
      <label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="50"></label>
      <label>Email<input name="email" type="email" autocomplete="email" required maxlength="255"></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72" aria-describedby="password-help"></label>
      <small id="password-help">Use at least 8 characters (up to 72 UTF-8 bytes).</small>
      <button type="submit">Create account</button>
    </form>
    <p role="alert" hidden></p>
    <p role="status" hidden></p>
    <p>Already have an account? <a href="/login">Sign in</a></p>
  </main>
</body>
</html>
